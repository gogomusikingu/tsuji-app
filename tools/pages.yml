# Copy to .github/workflows/pages.yml when publishing (pushing workflow files needs the GitHub "workflow" permission).
# Publishes the web version to GitHub Pages on every push to main.
# Needs: the repository set to public, and Settings > Pages > Source set to "GitHub Actions".
name: Deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install fonttools brotli
      - run: python tools/build_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/tests/*.test.js
      - run: rm -rf web/tests
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
